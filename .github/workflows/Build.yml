name: Build LuaPlayer - PS2

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build (PS2)
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Pre-install git
        run: |
          apk update
          apk add --no-cache git ca-certificates
          git --version

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apk add --no-cache make bash binutils python3 coreutils findutils curl

      - name: Create ee-* toolchain symlinks
        run: |
          set -e
          mkdir -p /usr/local/bin
          for dir in ee iop dvp; do
            [ -d "$PS2DEV/$dir/bin" ] || continue
            for f in "$PS2DEV/$dir/bin/mips64r5900el-ps2-elf-"*; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              name=${base#mips64r5900el-ps2-elf-}
              ln -sf "$f" "/usr/local/bin/${dir}-$name"
            done
          done
          ee-gcc --version | head -1

      - name: Probe container contents
        run: |
          echo "=== lua.h version ==="
          grep -E 'LUA_VERSION|LUA_RELEASE' "$PS2SDK/ports/include/lua.h" 2>/dev/null || echo "(no lua.h)"
          echo ""
          echo "=== existing liblua* in ports/lib ==="
          ls -la "$PS2SDK/ports/lib/"liblua* 2>/dev/null || echo "(none)"
          echo ""
          echo "=== ft2build.h ==="
          find "$PS2SDK" -name ft2build.h 2>/dev/null || echo "(missing)"
          echo ""
          echo "=== other ports libs ==="
          ls "$PS2SDK/ports/lib/" 2>/dev/null | head -40 || echo "(none)"
          echo ""
          echo "=== disk space ==="
          df -h / /tmp 2>/dev/null || true
          echo ""
          echo "=== memory ==="
          free -m 2>/dev/null || cat /proc/meminfo | head -5 || true

      - name: Build FreeType if missing
        run: |
          set -e
          if find "$PS2SDK" -name ft2build.h 2>/dev/null | grep -q .; then
            echo "FreeType already present."
          else
            cd /tmp
            git clone --depth 1 https://github.com/ps2dev/ps2sdk-ports.git
            cd ps2sdk-ports
            for port in zlib freetype; do
              [ -d "$port" ] && ( cd "$port" && make -j2 && make install ) || true
            done
          fi

      - name: Patch Makefile.ps2 with freetype2 include
        run: |
          set -e
          FT_DIR=$(find "$PS2SDK" -name ft2build.h 2>/dev/null | head -1)
          [ -z "$FT_DIR" ] && { echo "no ft2build.h"; exit 0; }
          FT_INC_DIR=$(dirname "$FT_DIR")
          REL=${FT_INC_DIR#"$PS2SDK"/}
          cp Makefile.ps2 Makefile.ps2.orig
          sed -i "s#-I\$(PS2SDK)/ports/include\b#-I\$(PS2SDK)/ports/include -I\$(PS2SDK)/$REL#g" Makefile.ps2 || true
          grep -n "ports/include" Makefile.ps2 || true

      - name: Build and install Lua 5.1.5 for PS2
        run: |
          set -e

          if grep -q '"Lua 5\.1' "$PS2SDK/ports/include/lua.h" 2>/dev/null; then
            echo "Lua 5.1 already installed."
            exit 0
          fi

          echo "Container ships an incompatible Lua. Building 5.1.5..."

          cd /tmp
          curl -fsSL -o lua-5.1.5.tar.gz https://www.lua.org/ftp/lua-5.1.5.tar.gz
          tar xzf lua-5.1.5.tar.gz
          cd lua-5.1.5

          EE_GCC="$PS2DEV/ee/bin/mips64r5900el-ps2-elf-gcc"
          EE_AR="$PS2DEV/ee/bin/mips64r5900el-ps2-elf-ar"
          EE_RANLIB="$PS2DEV/ee/bin/mips64r5900el-ps2-elf-ranlib"

          make -C src clean || true
          make -C src \
              a \
              CC="$EE_GCC" \
              AR="$EE_AR rcu" \
              RANLIB="$EE_RANLIB" \
              MYCFLAGS="-D_EE -O2 -G0 -Wall -I$PS2SDK/ee/include -I$PS2SDK/common/include" \
              MYLDFLAGS="-L$PS2SDK/ee/lib -L$PS2SDK/common/lib" \
              MYLIBS="-lm" \
              -j2

          echo "=== built libs ==="
          ls -la src/*.a

          mkdir -p "$PS2SDK/ports/lib" "$PS2SDK/ports/include"
          rm -f "$PS2SDK/ports/lib/"liblua*.a
          rm -f "$PS2SDK/ports/include/"{lua.h,luaconf.h,lualib.h,lauxlib.h}

          cp -v src/liblua.a "$PS2SDK/ports/lib/"
          cp -v src/liblua.a "$PS2SDK/ports/lib/liblualib.a"
          cp -v src/lua.h src/luaconf.h src/lualib.h src/lauxlib.h \
                "$PS2SDK/ports/include/"

          echo "=== verify installation ==="
          grep -E 'LUA_VERSION|LUA_RELEASE' "$PS2SDK/ports/include/lua.h"
          ls -la "$PS2SDK/ports/lib/"liblua*.a

      - name: Patch libtime.h to avoid struct timeval redefinition
        run: |
          set -e
          FILE=src/ps2sdk/libtime.h
          cp "$FILE" "$FILE.orig"
          awk '
            /^struct[[:space:]]+timeval[[:space:]]*\{/ {
              print "#if !defined(_SYS__TIMEVAL_H_) && !defined(_TIMEVAL_DEFINED) && !defined(_STRUCT_TIMEVAL_DEFINED)"
              intv = 1
            }
            intv && /^\}/ {
              print $0
              print "#define _STRUCT_TIMEVAL_DEFINED 1"
              print "#endif"
              intv = 0
              next
            }
            { print }
          ' "$FILE" > "$FILE.new"
          mv "$FILE.new" "$FILE"
          echo "--- patched region ---"
          grep -n -B2 -A6 "STRUCT_TIMEVAL_DEFINED" "$FILE" | head -40 || true

      - name: Create usbhdfsd stub if missing
        run: |
          if [ ! -d src/ps2sdk/usbhdfsd ]; then
            mkdir -p src/ps2sdk/usbhdfsd
            printf 'all:\n\t@echo "usbhdfsd: stub"\nclean:\n\t@echo "usbhdfsd: stub clean"\ninstall:\n\t@echo "usbhdfsd: stub install"\n' > src/ps2sdk/usbhdfsd/Makefile
          fi
          ls -la src/ps2sdk/usbhdfsd/

      # ------------------------------------------------------------------
      # NEW DIAGNOSTIC: print the Makefiles and a dry-run plan
      # ------------------------------------------------------------------
      - name: Diagnose Makefile structure
        run: |
          echo "===== Makefile ====="
          cat Makefile
          echo ""
          echo "===== Makefile.pref ====="
          cat Makefile.pref
          echo ""
          echo "===== Makefile.eeglobal ====="
          cat Makefile.eeglobal
          echo ""
          echo "===== Makefile.ps2 ====="
          cat Makefile.ps2
          echo ""
          echo "===== make -n (dry run, first 120 lines) ====="
          make clean >/dev/null 2>&1 || true
          make -n 2>&1 | head -120 || true
          echo "===== end dry run ====="

      # ------------------------------------------------------------------
      # Build serially, capture exit code explicitly
      # ------------------------------------------------------------------
      - name: Build LuaPlayer
        shell: bash
        run: |
          make clean >/dev/null 2>&1 || true
          set +e
          make -j1 > build.log 2>&1
          MAKE_EXIT=$?
          set -e
          echo "==============================================================="
          echo "make exit code: $MAKE_EXIT"
          echo "=================== build.log (last 250 lines) ================"
          tail -250 build.log || true
          echo "==============================================================="
          echo "=== files produced in src/ ==="
          ls -la src/*.o 2>/dev/null | head -40 || echo "(no .o files)"
          echo "=== ELF check ==="
          ls -la luaplayer.elf 2>/dev/null || echo "(no luaplayer.elf)"
          # Do not exit nonzero here; the next step verifies the ELF

      - name: Locate built ELF
        id: elf
        shell: bash
        run: |
          ELF=""
          for cand in luaplayer.elf luaplayer build/luaplayer.elf; do
            if [ -f "$cand" ]; then ELF="$cand"; break; fi
          done
          if [ -z "$ELF" ]; then
            echo "==============================================================="
            echo "ERROR: no ELF produced by the build."
            echo "=================== last 250 lines of build.log ==============="
            tail -250 build.log || true
            echo "==============================================================="
            exit 1
          fi
          echo "Built ELF: $ELF"
          ls -la "$ELF"
          echo "path=$ELF" >> "$GITHUB_OUTPUT"

      - name: Pack release ELF
        shell: bash
        run: |
          SRC="${{ steps.elf.outputs.path }}"
          cp "$SRC" LUAPLAYER.ELF
          ls -la LUAPLAYER.ELF

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log_${{ github.sha }}
          path: build.log
          if-no-files-found: warn

      - name: Upload LUAPLAYER.ELF
        uses: actions/upload-artifact@v4
        with:
          name: LuaPlayer-PS2_${{ github.sha }}
          path: LUAPLAYER.ELF
          if-no-files-found: error

      - name: Upload unpacked ELF (debug)
        uses: actions/upload-artifact@v4
        with:
          name: debug-luaplayer-elf_${{ github.sha }}
          path: ${{ steps.elf.outputs.path }}
          if-no-files-found: warn
