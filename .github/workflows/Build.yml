name: Build LuaPlayer - PS2

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - 'Makefile.ps2'
      - 'Makefile.pref'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build (PS2)
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      # ------------------------------------------------------------------
      # 1. Install git BEFORE checkout so submodules are supported.
      #    The Alpine image does not ship a modern git, so checkout@v4
      #    would otherwise fall back to the REST API (no submodules).
      # ------------------------------------------------------------------
      - name: Pre-install git (required for submodule checkout)
        run: |
          apk update
          apk add --no-cache git ca-certificates
          git --version

      # ------------------------------------------------------------------
      # 2. Now checkout works via real git clone + submodules
      # ------------------------------------------------------------------
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 3. Remaining build deps
      # ------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          apk add --no-cache make bash binutils python3 coreutils findutils

      # ------------------------------------------------------------------
      # 4. Recreate the legacy ee-*/iop-* toolchain symlinks that the
      #    old Makefile.pref expects but the modern image no longer ships.
      # ------------------------------------------------------------------
      - name: Create ee-* / iop-* toolchain symlinks
        run: |
          set -e
          mkdir -p /usr/local/bin

          if [ -d "$PS2DEV/ee/bin" ]; then
            for f in "$PS2DEV"/ee/bin/mips64r5900el-ps2-elf-*; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              name=${base#mips64r5900el-ps2-elf-}
              ln -sf "$f" "/usr/local/bin/ee-$name"
            done
          fi

          if [ -d "$PS2DEV/iop/bin" ]; then
            for f in "$PS2DEV"/iop/bin/mips64r5900el-ps2-elf-*; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              name=${base#mips64r5900el-ps2-elf-}
              ln -sf "$f" "/usr/local/bin/iop-$name"
            done
          fi

          echo "--- symlinks ---"
          ls -la /usr/local/bin/ | grep -E ' (ee|iop)-' | head -40 || true
          echo "--- sanity ---"
          ee-gcc --version | head -1
          iop-gcc --version | head -1 || true

      # ------------------------------------------------------------------
      # 5. Diagnostic: confirm submodules landed
      # ------------------------------------------------------------------
      - name: Show repo layout
        run: |
          echo "--- top level ---"
          ls -la
          echo ""
          echo "--- .gitmodules ---"
          cat .gitmodules 2>/dev/null || echo "(no .gitmodules)"
          echo ""
          echo "--- src/ps2sdk ---"
          ls -la src/ps2sdk/ || true
          echo ""
          echo "--- src/ps2sdk/usbhdfsd (submodule) ---"
          ls -la src/ps2sdk/usbhdfsd/ 2>/dev/null | head || echo "(missing)"

      # ------------------------------------------------------------------
      # 6. Build
      # ------------------------------------------------------------------
      - name: Build LuaPlayer
        shell: bash
        run: |
          set -o pipefail
          make clean || true
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Locate built ELF
        id: elf
        if: always()
        shell: bash
        run: |
          ELF=""
          for cand in luaplayer.elf luaplayer build/luaplayer.elf; do
            if [ -f "$cand" ]; then ELF="$cand"; break; fi
          done
          if [ -z "$ELF" ]; then
            echo "No ELF built (build likely failed earlier)."
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "Built ELF: $ELF"
            echo "path=$ELF" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug — inspect ELF
        if: steps.elf.outputs.path != ''
        shell: bash
        run: |
          ELF="${{ steps.elf.outputs.path }}"
          OBJDUMP="$PS2DEV/ee/bin/mips64r5900el-ps2-elf-objdump"
          NM="$PS2DEV/ee/bin/mips64r5900el-ps2-elf-nm"
          echo "=== File info ===";  ls -la "$ELF"
          echo ""; echo "=== Sections ==="; "$OBJDUMP" -h "$ELF" | head -60
          echo ""; echo "=== Symbols ===";  "$NM" -S "$ELF" | wc -l

      - name: Pack release ELF
        if: steps.elf.outputs.path != ''
        shell: bash
        run: |
          SRC="${{ steps.elf.outputs.path }}"
          if command -v ps2-packer >/dev/null 2>&1; then
            ps2-packer "$SRC" LUAPLAYER.ELF
          elif [ -x "$PS2DEV/bin/ps2-packer-lite" ]; then
            "$PS2DEV/bin/ps2-packer-lite" "$SRC" LUAPLAYER.ELF
          else
            cp "$SRC" LUAPLAYER.ELF
          fi
          ls -la LUAPLAYER.ELF

      # ------------------------------------------------------------------
      # 7. Artifacts — always upload the log, conditionally the ELF
      # ------------------------------------------------------------------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log_${{ github.sha }}
          path: build.log
          if-no-files-found: warn

      - name: Upload LUAPLAYER.ELF
        if: steps.elf.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: LuaPlayer-PS2_${{ github.sha }}
          path: LUAPLAYER.ELF
          if-no-files-found: error

      - name: Upload unpacked ELF (debug)
        if: steps.elf.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: debug-luaplayer-elf_${{ github.sha }}
          path: ${{ steps.elf.outputs.path }}
          if-no-files-found: warn
