name: Build LuaPlayer - PS2

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build (PS2)
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      # 1. Install git BEFORE checkout so submodules work
      - name: Pre-install git
        run: |
          apk update
          apk add --no-cache git ca-certificates
          git --version

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apk add --no-cache make bash binutils python3 coreutils findutils

      # 2. Create ee-* toolchain symlinks (Makefile.pref expects these)
      - name: Create ee-* toolchain symlinks
        run: |
          set -e
          mkdir -p /usr/local/bin
          for dir in ee iop dvp; do
            [ -d "$PS2DEV/$dir/bin" ] || continue
            for f in "$PS2DEV/$dir/bin/mips64r5900el-ps2-elf-"*; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              name=${base#mips64r5900el-ps2-elf-}
              ln -sf "$f" "/usr/local/bin/${dir}-$name"
            done
          done
          echo "--- sanity ---"
          ee-gcc --version | head -1

      # 3. Probe what's actually in the container
      - name: Probe container contents
        run: |
          echo "=== ports/include ==="
          ls "$PS2SDK/ports/include/" 2>/dev/null | head -40 || echo "(missing)"
          echo ""
          echo "=== ft2build.h anywhere? ==="
          find "$PS2SDK" -name ft2build.h 2>/dev/null || echo "(none)"
          echo ""
          echo "=== gsKit ==="
          ls "$PS2DEV/gsKit/lib" 2>/dev/null || ls "$GSKIT/lib" 2>/dev/null || echo "(none)"
          echo ""
          echo "=== liblua ==="
          find "$PS2SDK" -name 'liblua*' 2>/dev/null || echo "(none)"
          echo ""
          echo "=== libmikmod ==="
          find "$PS2SDK" -name 'libmikmod*' 2>/dev/null || echo "(none)"

      # 4. Build FreeType (and friends) from ps2sdk-ports if missing
      - name: Build missing ps2sdk ports
        run: |
          set -e
          if find "$PS2SDK" -name ft2build.h 2>/dev/null | grep -q .; then
            echo "FreeType already present, skipping."
          else
            echo "FreeType missing, building from ps2sdk-ports..."
            cd /tmp
            git clone --depth 1 https://github.com/ps2dev/ps2sdk-ports.git
            cd ps2sdk-ports

            for port in zlib freetype; do
              if [ -d "$port" ]; then
                echo "==== building $port ===="
                ( cd "$port" && make -j"$(nproc)" && make install ) \
                  || echo "!!! $port build failed (continuing)"
              fi
            done

            echo "=== after build ==="
            find "$PS2SDK" -name ft2build.h 2>/dev/null || echo "(still no ft2build.h)"
          fi

      # 5. Patch Makefile.ps2 to add the freetype2 include path.
      #    FreeType installs headers under ports/include/freetype2/, but
      #    LuaPlayer's Makefile only passes ports/include.
      - name: Patch Makefile.ps2 with freetype2 include
        run: |
          set -e
          FT_DIR=$(find "$PS2SDK" -name ft2build.h 2>/dev/null | head -1)
          echo "ft2build.h -> $FT_DIR"
          if [ -z "$FT_DIR" ]; then
            echo "WARNING: no ft2build.h found; build will likely fail."
            exit 0
          fi
          FT_INC_DIR=$(dirname "$FT_DIR")
          REL=${FT_INC_DIR#"$PS2SDK"/}
          echo "Adding include: \$(PS2SDK)/$REL"

          # Back up and patch every occurrence of ports/include
          cp Makefile.ps2 Makefile.ps2.orig
          # Insert the extra -I after ports/include (not after ports/include/zlib)
          sed -i "s#-I\$(PS2SDK)/ports/include\b#-I\$(PS2SDK)/ports/include -I\$(PS2SDK)/$REL#g" Makefile.ps2 || true

          echo "--- patched include lines ---"
          grep -n "ports/include" Makefile.ps2 || true

      # 6. Stub the missing usbhdfsd directory so `make clean` doesn't fail
      - name: Create usbhdfsd stub if missing
        run: |
          if [ ! -d src/ps2sdk/usbhdfsd ]; then
            echo "Creating stub for src/ps2sdk/usbhdfsd..."
            mkdir -p src/ps2sdk/usbhdfsd
            cat > src/ps2sdk/usbhdfsd/Makefile <<'EOF'
          all:
          	@echo "usbhdfsd: stub (nothing to build)"
          clean:
          	@echo "usbhdfsd: stub clean"
          install:
          	@echo "usbhdfsd: stub install"
          EOF
          fi
          ls -la src/ps2sdk/usbhdfsd/

      # 7. Build
      - name: Build LuaPlayer
        shell: bash
        run: |
          set -o pipefail
          make clean || true
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Locate built ELF
        id: elf
        if: always()
        shell: bash
        run: |
          ELF=""
          for cand in luaplayer.elf luaplayer build/luaplayer.elf; do
            if [ -f "$cand" ]; then ELF="$cand"; break; fi
          done
          if [ -z "$ELF" ]; then
            echo "No ELF produced."
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "Built ELF: $ELF"
            echo "path=$ELF" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack release ELF
        if: steps.elf.outputs.path != ''
        shell: bash
        run: |
          SRC="${{ steps.elf.outputs.path }}"
          cp "$SRC" LUAPLAYER.ELF
          ls -la LUAPLAYER.ELF

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log_${{ github.sha }}
          path: build.log
          if-no-files-found: warn

      - name: Upload LUAPLAYER.ELF
        if: steps.elf.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: LuaPlayer-PS2_${{ github.sha }}
          path: LUAPLAYER.ELF
          if-no-files-found: error
