name: Build LuaPlayer - PS2

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - 'Makefile.ps2'
      - 'Makefile.pref'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build (PS2)
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apk update
          apk add --no-cache make git curl bash binutils python3 coreutils findutils

      - name: Create ee-* / iop-* toolchain symlinks
        run: |
          set -e
          mkdir -p /usr/local/bin

          # EE toolchain: mips64r5900el-ps2-elf-*  ->  ee-*
          if [ -d "$PS2DEV/ee/bin" ]; then
            for f in "$PS2DEV"/ee/bin/mips64r5900el-ps2-elf-*; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              name=${base#mips64r5900el-ps2-elf-}
              ln -sf "$f" "/usr/local/bin/ee-$name"
            done
          fi

          # IOP toolchain: try the same prefix, then fall back
          if [ -d "$PS2DEV/iop/bin" ]; then
            for f in "$PS2DEV"/iop/bin/mips64r5900el-ps2-elf-*; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              name=${base#mips64r5900el-ps2-elf-}
              ln -sf "$f" "/usr/local/bin/iop-$name"
            done
          fi

          echo "--- created symlinks ---"
          ls -la /usr/local/bin/ | grep -E ' (ee|iop)-' | head -40 || true

          echo "--- sanity check ---"
          ee-gcc --version | head -1
          iop-gcc --version | head -1 || true

      - name: Show repo layout (diagnostic)
        run: |
          echo "--- top level ---"
          ls -la
          echo ""
          echo "--- .gitmodules ---"
          cat .gitmodules 2>/dev/null || echo "(no .gitmodules)"
          echo ""
          echo "--- src/ps2sdk ---"
          ls -la src/ps2sdk/ || true
          echo ""
          echo "--- src/ps2sdk/usbhdfsd (submodule) ---"
          ls -la src/ps2sdk/usbhdfsd/ 2>/dev/null | head || echo "(missing)"
          echo ""
          echo "--- ps2sdk ports ---"
          ls "$PS2SDK/ports/lib/" 2>/dev/null | head -40 || echo "(no ports/lib)"
          echo ""
          echo "--- gsKit ---"
          ls "$PS2DEV/gsKit/lib/" 2>/dev/null | head || echo "(no gsKit/lib)"

      - name: Build LuaPlayer
        shell: bash
        run: |
          set -o pipefail
          make clean || true
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Locate built ELF
        id: elf
        shell: bash
        run: |
          ELF=""
          for cand in luaplayer.elf luaplayer build/luaplayer.elf; do
            if [ -f "$cand" ]; then ELF="$cand"; break; fi
          done
          if [ -z "$ELF" ]; then
            echo "ERROR: could not find built ELF. Listing current directory:"
            ls -la
            exit 1
          fi
          echo "Built ELF: $ELF"
          echo "path=$ELF" >> "$GITHUB_OUTPUT"

      - name: Debug — inspect ELF
        shell: bash
        run: |
          ELF="${{ steps.elf.outputs.path }}"
          OBJDUMP="$PS2DEV/ee/bin/mips64r5900el-ps2-elf-objdump"
          NM="$PS2DEV/ee/bin/mips64r5900el-ps2-elf-nm"
          echo "=== File info ==="
          ls -la "$ELF"
          echo ""
          echo "=== Section headers ==="
          "$OBJDUMP" -h "$ELF" 2>&1 | head -60
          echo ""
          echo "=== Symbol count ==="
          "$NM" -S "$ELF" 2>&1 | wc -l
          echo ""
          echo "=== LuaPlayer symbols ==="
          "$NM" -S "$ELF" 2>&1 | grep -iE "lua|luaplayer|graphics|controls|sound" | head -30 || true

      - name: Pack release ELF
        shell: bash
        run: |
          SRC="${{ steps.elf.outputs.path }}"
          if command -v ps2-packer >/dev/null 2>&1; then
            ps2-packer "$SRC" LUAPLAYER.ELF
          elif [ -x "$PS2DEV/bin/ps2-packer-lite" ]; then
            "$PS2DEV/bin/ps2-packer-lite" "$SRC" LUAPLAYER.ELF
          else
            echo "ps2-packer not found, shipping uncompressed ELF"
            cp "$SRC" LUAPLAYER.ELF
          fi
          ls -la LUAPLAYER.ELF

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log_${{ github.sha }}
          path: build.log
          if-no-files-found: warn

      - name: Upload LUAPLAYER.ELF
        uses: actions/upload-artifact@v4
        with:
          name: LuaPlayer-PS2_${{ github.sha }}
          path: LUAPLAYER.ELF
          if-no-files-found: error

      - name: Upload unpacked ELF (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-luaplayer-elf_${{ github.sha }}
          path: ${{ steps.elf.outputs.path }}
          if-no-files-found: warn
